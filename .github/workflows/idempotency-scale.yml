name: Idempotency Scale Acceptance
on:
  pull_request:
    paths:
      - "src/idempotency-store.mjs"
      - "src/store.mjs"
      - "benchmarks/idempotency-scale.mjs"
      - ".github/workflows/idempotency-scale.yml"
  push:
    branches: [main]
    paths:
      - "src/idempotency-store.mjs"
      - "src/store.mjs"
      - "benchmarks/idempotency-scale.mjs"
      - ".github/workflows/idempotency-scale.yml"
permissions:
  contents: read
jobs:
  indexed-idempotency-100k:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: node benchmarks/idempotency-scale.mjs
